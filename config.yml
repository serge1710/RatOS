- name: raspberry_pi-arm64-trixie
  type: raspberry
  img_download_url: https://downloads.raspberrypi.org/raspios_lite_arm64_latest.torrent
  img_hash_url: https://downloads.raspberrypi.org/raspios_lite_arm64_latest.sha256
  env:
    ARCH: arm64
    IMAGE_ENLARGEROOT: 10000
    MOUNT_PROC: 1
    MOUNT_SYS: 1
    INIT_FORMAT: cloudinit-rpi
  special_modules: []
  rpi_json:
    name: RatOS $VERSION$ - Pi 4 / Pi 5 / CM5 (64-bit)
    description: RatOS 2.1 on Raspberry Pi OS Lite Trixie ARM64; USB MCU only
    icon: https://os.mainsail.xyz/rpi-imager.png
    devices:
    - pi4-64bit
    - pi5-64bit
    - cm5-64bit
